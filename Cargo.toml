[package]
name = "niri-sidestage"
version = "0.4.0"
edition = "2024"
description = "A slide-out side strip for niri that switches windows and workspaces per monitor"
license = "MIT"
repository = "https://github.com/anisharaz/niri-sidestage"
readme = "README.md"
keywords = ["niri", "wayland", "window-switcher"]

[dependencies]
gtk4 = "0.11.5"
gtk4-layer-shell = "0.8.1"
niri-ipc = "26.4.0"

[profile.release]
strip = true
lto = "thin"
